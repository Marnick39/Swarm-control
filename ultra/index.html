<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World-HF-1 · the July 2026 swarm · Sim browser</title>
<meta name="description" content="A control-budget wargame on the documented July 2026 Hugging Face agent-swarm incident, in the swecraft sim-browser idiom." />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app">
  <!-- full-bleed map -->
  <div id="map"></div>

  <!-- list views (map is hidden behind these when active) -->
  <div id="view-agents" class="view-wrap"></div>
  <div id="view-forge" class="view-wrap"></div>
  <div id="view-eval" class="view-wrap"></div>
  <div id="view-audit" class="view-wrap"></div>

  <!-- left nav rail -->
  <nav id="rail"></nav>

  <!-- left info panel -->
  <aside id="panel"></aside>

  <!-- bottom toolbar -->
  <div id="toolbar"></div>

  <!-- back to map -->
  <button class="backmap" id="backmap">&larr; Back to the map</button>

  <!-- hover card -->
  <div id="hover"></div>

  <div class="watermark" id="watermark"></div>
</div>

<script src="data/bundle.js"></script>
<script src="js/icons.js"></script>
<script src="js/hex.js"></script>
<script src="js/buildings.js"></script>
<script src="js/map.js"></script>
<script src="js/panel.js"></script>
<script src="js/views.js"></script>
<script src="js/timeline.js"></script>
<script src="js/app.js"></script>
</body>
</html>
